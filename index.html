<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celestial Atlas — Interactive Astrology Map</title>
  <meta name="theme-color" content="#030510" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Celestial Atlas" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="space"></div>

  <header id="masthead">
    <h1>✶ Celestial Atlas</h1>
    <p>An interactive map of your sky</p>
  </header>

  <!-- ── Birth details menu ─────────────────────────────────────────── -->
  <aside id="menu" class="panel">
    <button id="menu-toggle" class="panel-toggle" title="Show / hide">☰</button>
    <div class="panel-body">
      <h2>Your Birth Sky</h2>
      <form id="birth-form">
        <div id="date-readout" class="date-readout">June 15, 1990 · 12:00 PM</div>
        <label class="slider-label">Year <span class="slider-val" id="val-year">1990</span>
          <input type="range" id="sl-year" min="1900" max="2030" step="1" value="1990" />
        </label>
        <label class="slider-label">Month <span class="slider-val" id="val-month">June</span>
          <input type="range" id="sl-month" min="1" max="12" step="1" value="6" />
        </label>
        <label class="slider-label">Day <span class="slider-val" id="val-day">15</span>
          <input type="range" id="sl-day" min="1" max="30" step="1" value="15" />
        </label>
        <label class="slider-label">Time born <span class="slider-val" id="val-time">12:00 PM</span>
          <input type="range" id="sl-time" min="0" max="1435" step="5" value="720" />
        </label>
        <label>Birthplace
          <select id="in-city"></select>
        </label>
        <div id="custom-place" class="row3 hidden">
          <label>Lat °<input type="number" id="in-lat" step="0.01" min="-89.9" max="89.9" value="40.71" /></label>
          <label>Lon °<input type="number" id="in-lon" step="0.01" min="-180" max="180" value="-74.01" /></label>
          <label>UTC±<input type="number" id="in-utc" step="0.25" min="-12" max="14" value="-5" /></label>
        </div>
        <p class="hint" id="tz-hint"></p>
        <label class="check"><input type="checkbox" id="in-dst" /> Daylight saving time was in effect</label>
        <button type="submit" id="reveal-btn">✶ Reveal My Chart</button>
      </form>
      <div id="nav-buttons" class="hidden">
        <h3>Fly to…</h3>
        <div class="btn-grid">
          <button data-fly="geometry" class="fly wide">☍ My birth sky geometry</button>
          <button data-fly="sun" class="fly sun">☉ Sun sign</button>
          <button data-fly="moon" class="fly moon">☾ Moon sign</button>
          <button data-fly="rising" class="fly rising">↑ Rising sign</button>
          <button data-fly="earth" class="fly">♁ Earth</button>
          <button data-fly="overview" class="fly wide">✶ Solar system overview</button>
        </div>
      </div>
      <div id="famous-section">
        <h3>Famous charts</h3>
        <select id="famous-cat"></select>
        <div id="famous-list"></div>
      </div>
      <p id="now-sky" class="now-sky"></p>
      <p class="fineprint">Positions computed from real ephemeris formulas
        (tropical zodiac, whole-sign houses). Scene distances are stylized for
        visibility. For entertainment &amp; wonder.</p>
    </div>
  </aside>

  <!-- ── Results panel ──────────────────────────────────────────────── -->
  <aside id="results" class="panel hidden">
    <button id="results-toggle" class="panel-toggle" title="Show / hide">☉</button>
    <div class="panel-body">
      <h2 id="results-title">Your Chart</h2>
      <p id="chart-note" class="chart-note hidden"></p>
      <div id="big-three"></div>
      <div id="kindred" class="hidden"></div>
      <nav id="tabs">
        <button class="tab active" data-tab="sun">Sun</button>
        <button class="tab" data-tab="moon">Moon</button>
        <button class="tab" data-tab="rising">Rising</button>
        <button class="tab" data-tab="planets">Planets</button>
        <button class="tab" data-tab="elements">Elements</button>
        <button class="tab" data-tab="houses">Houses</button>
      </nav>
      <div id="tab-content"></div>
    </div>
  </aside>

  <div id="toast" class="hidden"></div>

  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('./sw.js').catch((e) =>
          console.warn('SW registration failed:', e)));
    }
  </script>
</body>
</html>
