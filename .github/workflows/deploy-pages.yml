name: Publish to GitHub Pages

# The site is served from the gh-pages branch (branch-based Pages).
# This workflow keeps gh-pages in sync with main on every push, which
# only needs the default token's contents:write — no admin permissions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync main to gh-pages
        run: git push --force origin HEAD:gh-pages
